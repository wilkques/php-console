name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  # composer.json declares "php": ">=5.3" and, as of this package's rewrite
  # to replace league/climate's help-listing table with a self-contained
  # formatter (src/Support/HelperListFormatter.php), that's the real floor
  # too — league/climate was this package's only PHP 7.3+ dependency (a
  # hard "require", not "require-dev"; it itself declared
  # "php": "^7.3 || ^8.0"), so composer install could never actually
  # succeed below 7.3 no matter what composer.json's own "php" constraint
  # said. Removing it, and converting the handful of PHP 5.4+ constructs
  # `[]` short arrays, `func()['key']` call-result dereferencing,
  # `(new Foo())->bar()` new-then-call chaining, `array_column()` in
  # src/, plus `::class` (5.5+) in tests/ — drops the real floor all the
  # way to the declared 5.3.
  #
  # composer.json's require-dev also pins "phpunit/phpunit": "*" (not a
  # fixed version), so composer resolves whichever major version the
  # running PHP can actually install — PHPUnit 4.8 on 5.3, up through
  # whatever's newest on 8.5+ — and tests/TestCase.php picks the right
  # setUp()/tearDown() shape (and tests/Compat/*.php the right assertion/
  # expectation method names) for whatever actually got installed, at
  # runtime via reflection / method_exists() (see tests/bootstrap.php).
  #
  # 5.3 needs its own job rather than a matrix entry alongside the others
  # below: its image's glibc predates the Node.js runtime the Actions
  # runner injects into job `container:`s (and into `shivammathur/setup-
  # php`'s own installation), which would break both actions/checkout and
  # setup-php. Composer itself has the same problem one version up — 2.3+
  # dropped PHP <7.2.5 outright — so this job downloads the last 2.2.x LTS
  # release (which still ran on 5.3) on the host runner, then mounts it
  # into a plain `docker run` for both `composer install` and `phpunit`.
  test-php53:
    name: "PHPUnit (PHP 5.3)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Composer 2.2 LTS (last release supporting PHP 5.3)
        run: curl -sSL https://getcomposer.org/download/2.2.25/composer.phar -o composer53.phar

      - name: Install dependencies and run test suite on PHP 5.3
        run: |
          docker run --rm -v "$PWD":/app -w /app cespi/php-5.3:cli sh -c '
            php composer53.phar install --no-interaction --prefer-dist &&
            vendor/bin/phpunit -c phpunit.xml
          '

  test:
    name: "PHPUnit (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.6 up: shivammathur/setup-php and actions/checkout both work
        # normally here, unlike on 5.3 — see test-php53 above.
        #
        # Ceiling is 8.3 for now — NOT because of anything in this package.
        # wilkques/php-helper and wilkques/container both had implicit-
        # nullable-parameter deprecations on PHP 8.4 (array_pluck() and
        # setInstance() respectively), which this package's own suite
        # inherits transitively since a passing command's argv is threaded
        # through both. Both have been fixed locally (type hints dropped,
        # since both packages target PHP 5.x where "?Type" isn't valid
        # syntax) and verified directly against the fixed source — but this
        # job installs dependencies via `composer install` from Packagist,
        # which still serves the old, unfixed tagged releases until those
        # two packages actually publish a new version. Re-add '8.4' and
        # '8.5' here once wilkques/php-helper and wilkques/container have
        # tagged releases containing those fixes; no other change should be
        # needed since composer.json already allows any wilkques/container
        # >=5.0.0.
        php: ['5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite
        run: vendor/bin/phpunit -c phpunit.xml
